#
# This file is inlined into the HTTPD configuration when building the Jarvis Docker image.
# The purpose of this configuration is to enable FCGI within the running container.
#

# Load required modules.
LoadModule fcgid_module /usr/lib/apache2/modules/mod_fcgid.so
LoadModule perl_module /usr/lib/apache2/modules/mod_perl.so

# Once loaded set variables required to enable FCGI within the container.
<IfModule mod_fcgid.c>
    FcgidConnectTimeout 20
    FcgidMaxRequestLen 131072

    <IfModule mod_mime.c>
        AddHandler fcgid-script .fcgi
    </IfModule>
</IfModule>

# Enable the Fast CGI script alias for Jarvis.
ScriptAlias /jarvis-agent "/usr/share/jarvis/cgi-bin/fast-agent.fcgi"

# Ensure the correct permissions are enabled to activate the fact agent module.
<Directory /usr/share/jarvis/cgi-bin>
    Order deny,allow
    Allow from all
    Require all granted
</Directory>
